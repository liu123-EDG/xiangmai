<!DOCTYPE html>
<html lang="ug">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>十二木卡姆 · 文字浮现</title>
<style>
  /* ==========================================================================
     十二木卡姆 · 文字浮现
     --------------------------------------------------------------------------
     给发布会片子用的一个镜头：黑场里，维吾尔文从光里浮出来。

     层次（从下到上）：
       1  黑场 + 极暗的暖色中心
       2  一道横光扫过（给"从壁画里出来"做一个收束）
       3  浮现中的文字（模糊 → 清晰，暗 → 亮）
       4  光晕随文字呼吸
       5  浮尘（canvas 实时画，给画面一点空气）
       6  中文与英文，最后才出现

     录屏用：窗口拉到 1920×1080，按 R 重播。
     ========================================================================== */
  :root {
    --warm: #f2e4c4;          /* 文字暖白 */
    --gold: #d9b268;
    --dim: #cbbf9f;
    --cn: #d8cfb8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #000; overflow: hidden;
  }

  /* ---- 舞台：固定 16:9，居中 ---- */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  #frame {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    overflow: hidden;
    background: #000;
  }

  /* ---- 1. 中心暖光 ---- */
  .bloom {
    position: absolute; inset: 0;
    background: radial-gradient(closest-side at 50% 50%,
      rgba(217, 178, 104, 0.16) 0%,
      rgba(217, 178, 104, 0.06) 45%,
      rgba(0, 0, 0, 0) 78%);
    opacity: 0;
    animation: bloomIn 15s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes bloomIn {
    0%, 22%   { opacity: 0; }
    45%       { opacity: 0.55; }
    62%       { opacity: 1; }
    100%      { opacity: 0.82; }
  }

  /* ---- 2. 横光：从左扫到右，像一道光把黑场划开 ---- */
  .sweep {
    position: absolute; top: 0; bottom: 0; width: 42%;
    left: -45%;
    background: linear-gradient(90deg,
      rgba(242, 228, 196, 0) 0%,
      rgba(242, 228, 196, 0.055) 42%,
      rgba(255, 246, 221, 0.10) 52%,
      rgba(242, 228, 196, 0.055) 62%,
      rgba(242, 228, 196, 0) 100%);
    filter: blur(22px);
    animation: sweepMove 15s cubic-bezier(.33,0,.2,1) forwards;
  }
  @keyframes sweepMove {
    0%, 30% { left: -45%; opacity: 0; }
    34%     { opacity: 1; }
    62%     { left: 105%; opacity: 0.9; }
    72%     { opacity: 0; left: 105%; }
    100%    { left: 105%; opacity: 0; }
  }

  /* ---- 3. 文字 ---- */
  .lines {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3.2%;
    text-align: center;
  }

  .ug {
    /* 维吾尔文：从右往左，必须声明 rtl 才会连写正确 */
    direction: rtl;
    unicode-bidi: isolate;
    font-family: "Noto Naskh Arabic", "Scheherazade New", "Amiri",
                 "Segoe UI", Tahoma, serif;
    font-size: clamp(28px, 6.6vmin, 128px);
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--warm);
    white-space: nowrap;
    /* 浮现：模糊 + 压暗 → 清晰 + 亮 */
    filter: blur(22px) brightness(0.35);
    opacity: 0;
    transform: translateY(14px) scale(0.988);
    animation:
      ugRise 6.4s cubic-bezier(.16,.84,.28,1) var(--delay, 0s) forwards,
      ugGlow 6.5s ease-in-out calc(var(--delay, 0s) + 6.4s) infinite;
    text-shadow:
      0 0 26px rgba(217, 178, 104, 0.30),
      0 0 70px rgba(217, 178, 104, 0.14);
  }
  @keyframes ugRise {
    0%   { opacity: 0;    filter: blur(22px) brightness(0.35); transform: translateY(14px) scale(0.988); }
    38%  { opacity: 0.30; filter: blur(11px) brightness(0.62); transform: translateY(7px)  scale(0.995); }
    72%  { opacity: 0.82; filter: blur(2.4px) brightness(0.92); transform: translateY(1.5px) scale(0.999); }
    100% { opacity: 1;    filter: blur(0) brightness(1);        transform: none; }
  }
  @keyframes ugGlow {
    0%, 100% {
      text-shadow: 0 0 26px rgba(217,178,104,.30), 0 0 70px rgba(217,178,104,.14);
    }
    50% {
      text-shadow: 0 0 34px rgba(217,178,104,.44), 0 0 96px rgba(217,178,104,.20);
    }
  }

  /* ---- 6. 中文 / 英文：最后出现，字距拉开 ---- */
  .cn {
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
    font-size: clamp(11px, 1.9vmin, 34px);
    letter-spacing: 0.62em;
    text-indent: 0.62em;
    color: var(--cn);
    opacity: 0;
    animation: softIn 3.4s ease-out 12.1s forwards;
  }
  .lat {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: clamp(7px, 1.05vmin, 18px);
    letter-spacing: 0.66em;
    text-indent: 0.66em;
    color: rgba(216, 207, 184, 0.55);
    opacity: 0;
    animation: softIn 3.4s ease-out 12.9s forwards;
  }
  @keyframes softIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* 一条极细的分隔线，中英之间 */
  .rule {
    width: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(217,178,104,.5), transparent);
    animation: ruleGrow 2.6s cubic-bezier(.2,.8,.2,1) 12.4s forwards;
  }
  @keyframes ruleGrow {
    from { width: 0; opacity: 0; }
    to   { width: min(30vmin, 260px); opacity: 1; }
  }

  /* ---- 5. 浮尘 ---- */
  #dust {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    animation: dustIn 15s ease-out forwards;
  }
  @keyframes dustIn {
    0%, 20% { opacity: 0; }
    50%     { opacity: 0.9; }
    100%    { opacity: 0.55; }
  }

  /* 暗角：把视线收到中间 */
  .vig {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(closest-side at 50% 50%,
      rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 76%, rgba(0,0,0,0.92) 100%);
  }

  /* 录屏提示（按 H 隐藏） */
  #hint {
    position: fixed; left: 16px; bottom: 14px; z-index: 9;
    font: 11px/1.7 ui-monospace, Consolas, monospace;
    letter-spacing: .12em; color: rgba(255,255,255,.28);
    pointer-events: none; transition: opacity .3s;
  }
  #hint.off { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .ug, .bloom, .sweep, .cn, .lat, .rule, #dust { animation-duration: .01s !important; animation-delay: 0s !important; }
    .ug { filter: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="frame">
    <div class="bloom"></div>
    <div class="sweep"></div>
    <canvas id="dust"></canvas>

    <div class="lines">
      <!-- 维吾尔文：十二木卡姆 -->
      <div class="ug" style="--delay:.6s">ئون ئىككى مۇقام</div>
      <div class="rule"></div>
      <div class="cn">十 二 木 卡 姆</div>
      <div class="lat">STRINGLINE HERITAGE</div>
    </div>

    <div class="vig"></div>
  </div>
</div>

<div id="hint">R 重播 · H 隐藏提示 · 建议窗口 1920×1080 录屏</div>

<script>
/* ==========================================================================
   浮尘：给黑场一点空气。
   不做"发光粒子"，只做极暗的、缓慢下沉的尘点 —— 高级感的来源是克制。
   ========================================================================== */
(function dust() {
  const cv = document.getElementById('dust');
  const g = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const N = 90;
  const motes = [];

  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.width = Math.max(1, Math.round(r.width * dpr));
    H = cv.height = Math.max(1, Math.round(r.height * dpr));
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < N; i++) {
    motes.push({
      x: Math.random(), y: Math.random(),
      r: (Math.random() * 1.5 + 0.4),
      vy: (Math.random() * 0.00022 + 0.00006),   // 极慢地下沉
      vx: (Math.random() - 0.5) * 0.00008,
      a: Math.random() * 0.5 + 0.15,
      ph: Math.random() * Math.PI * 2,
    });
  }

  let t = 0;
  let raf = 0;
  function loop() {
    raf = requestAnimationFrame(loop);
    t += 1 / 60;
    g.clearRect(0, 0, W, H);
    for (const m of motes) {
      m.y += m.vy; m.x += m.vx;
      if (m.y > 1.02) { m.y = -0.02; m.x = Math.random(); }
      if (m.x < -0.02) m.x = 1.02;
      if (m.x > 1.02) m.x = -0.02;
      // 呼吸：明暗缓慢起伏，不是一闪一闪
      const a = m.a * (0.55 + 0.45 * Math.sin(t * 0.5 + m.ph));
      const px = m.x * W, py = m.y * H, rr = m.r * dpr;
      const grd = g.createRadialGradient(px, py, 0, px, py, rr * 4);
      grd.addColorStop(0, 'rgba(242,228,196,' + (a * 0.85).toFixed(3) + ')');
      grd.addColorStop(1, 'rgba(242,228,196,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(px, py, rr * 4, 0, Math.PI * 2); g.fill();
    }
  }
  raf = requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) raf = requestAnimationFrame(loop);
  });
})();

/* 重播：把所有动画重置。录屏时反复试很方便。 */
function replay() {
  const els = document.querySelectorAll('.ug, .bloom, .sweep, .cn, .lat, .rule, #dust');
  els.forEach((el) => {
    el.style.animation = 'none';
    void el.offsetWidth;                 // 强制重排，让动画能重放
    el.style.animation = '';
  });
}
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'r') replay();
  if (k === 'h') document.getElementById('hint').classList.toggle('off');
});

/* 自检用：报告各元素在某一时刻的实际状态 */
window.__XM_TEXTSTATE__ = () => {
  const q = (s) => document.querySelector(s);
  const st = (el) => {
    if (!el) return null;
    const cs = getComputedStyle(el);
    return { opacity: +(+cs.opacity).toFixed(3), filter: cs.filter, visible: +cs.opacity > 0.02 };
  };
  return JSON.stringify({
    ug: st(q('.ug')),
    cn: st(q('.cn')),
    lat: st(q('.lat')),
    bloom: st(q('.bloom')),
    text: q('.ug') ? q('.ug').textContent : null,
    dir: q('.ug') ? getComputedStyle(q('.ug')).direction : null,
  });
};
window.__XM_REPLAY__ = replay;
</script>
</body>
</html>
