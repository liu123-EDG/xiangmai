<!-- 传承之路 · 一页一关。
     哪一关由 URL 参数决定：?level=muqam（维吾尔族·十二木卡姆）
     或 ?level=gesar（藏族·格萨尔）。点八音旋律上的音符进这里。

     整屏一段：背景是场景（戈壁 / 草原），中间一块文字与选项。
     选错 → 播「失传」→ 闪回，只能重选。
     选对 → 播「活着」→ 播「成功案例」→ 收束。 -->
<main>
  <section class="act inherit-act" id="inherit-act">
    <div class="inherit" id="inherit">
      <div class="g-stage">
        <div class="g-bg" id="g-bg" aria-hidden="true"></div>
        <div class="g-scrim" aria-hidden="true"></div>

        <div class="g-box">
          <p class="g-kicker" id="g-kicker">传承之路</p>
          <h2 class="g-title" id="g-title">你是一名非遗传承人</h2>
          <p class="g-text" id="g-text"></p>
          <div class="g-choices" id="g-choices" role="group" aria-label="选择"></div>
          <p class="g-case" id="g-case" hidden></p>
          <button class="g-next" id="g-next" type="button" hidden></button>
        </div>

        <p class="g-progress" id="g-progress" aria-live="polite"></p>
      </div>
    </div>
  </section>
</main>
