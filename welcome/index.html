<!DOCTYPE html>
<html lang="ug">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>弦脉 · Stringline Heritage — 丝路口传音乐的数字档案</title>
<meta name="description" content="以新疆十二木卡姆为主线的口传音乐数字档案。三段式结构、十二套木卡姆、各民族音乐形态。">
<meta name="theme-color" content="#0a0908">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="弦脉 · Stringline Heritage">
<meta property="og:description" content="丝路口传音乐的数字档案。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0908'/%3E%3Crect x='12' y='4' width='8' height='8' fill='%233a2b28'/%3E%3Crect x='12' y='12' width='8' height='8' fill='%23c08a3e'/%3E%3Crect x='12' y='20' width='8' height='8' fill='%23a33b28'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../styles.css">
<style>
  /* ==========================================================================
     入口页
     --------------------------------------------------------------------------
     一整屏，只放这条概念片，别的不许出现。

     这条片子就是 tools/film.html 那一版，时间轴原样搬过来，
     一秒没改（早先我另做了一版"循环用"的，把文字那段删掉了，是错的）：

       0.00 –  5.09   第一段  壁画推进
       5.09 – 10.18   第二段  颜色抽干
       9.00          暖光起（文字从第二段末尾就开始浮）
       9.80 – 12.20   维吾尔文浮现（模糊 → 清晰）
      12.50          分隔线展开
      12.60 – 12.90   中文、英文
      13.40 – 16.40   定格三秒
      16.40 – 17.60   淡出到黑
      17.60 →  0      回到开头，循环

     品牌和引导语都撤了 —— 它们会压住画面。
     入口做成角落一个很轻的链接，只在片尾那两秒亮起来。

     类名一律带 w- 前缀：styles.css 是序章的样式表，
     里面有 .entry / .foot / .brand 这些通用名（而且给它们设了隐藏），
     入口页用同名会被按住 —— 已经因此踩过两次。
     ========================================================================== */
  html, body {
    margin: 0; height: 100%;
    background: #000; overflow: hidden;      /* 这一页不许滚 */
    scrollbar-width: none;
  }
  body::-webkit-scrollbar { display: none; }

  #stage { position: fixed; inset: 0; background: #000; }

  /* ---- 视频层 ---- */
  #hero-video {
    position: absolute; inset: 0;
    z-index: 1; overflow: hidden; background: #000;
    opacity: 1;
  }
  #hero-video video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s linear;
  }
  #hero-video video.on { opacity: 1; }

  /* 竖屏：改用 contain，不裁画面。
     素材是 16:9 横向的（那道金线横贯整幅），竖屏下 cover 会把两侧裁掉，
     金线只剩下中间一小团光 —— 手机截图里就是这样，构图全毁了。
     contain 会留上下黑边，但这片子的背景本来就是纯黑，接得上，看不出边。
     竖屏 390×844 算下来黑边只占约 12% 高度，画面依然占满。 */
  @media (orientation: portrait) {
    #hero-video video { object-fit: contain; }
  }

  /* 极轻的压暗：只在四角收一下视线，中间不动，保住画面的冲击力 */
  .w-vig {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(closest-side at 50% 50%,
      rgba(0,0,0,0) 46%, rgba(0,0,0,0.42) 100%);
  }

  /* ---- 浮尘 ---- */
  .w-dust {
    position: absolute; inset: 0; z-index: 3;
    width: 100%; height: 100%;
    mix-blend-mode: screen; opacity: 0;
    pointer-events: none;
  }

  /* ---- 文字浮现层 ----
     让字足够醒目，四层叠起来：
       ① 背后一团暖光（把字从黑里托起来）
       ② 字本身更亮、光晕更重
       ③ 持续呼吸 —— 明暗和大小都在极缓慢地起伏，不是静止的
       ④ 一道光泽从左扫到右，像金属反光
     全部克制：呼吸周期 4 秒，光泽 5 秒一次，不闪不跳。 */
  .w-title {
    position: absolute; inset: 0; z-index: 4;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0;
    text-align: center;
    pointer-events: none;
  }
  /* 行高固定成 1.15 —— 两件事一起解决：
     ① 金线能**正好压在维语的中线**上（原来行高 1.5，下半截空着，
        金线被推到字下面去，跟字脱开了）；
     ② 这一层的高度可控，下面汉字和金线的位置才算得准。 */
  .w-title__row {
    position: relative;
    display: block;
    line-height: 1.15;
  }

  .w-title__ug {
    /* 维吾尔文：这套文化的原生名。**在上面当主标题。**
       用户定的是"维语在上、汉字在下" —— 维语是它自己的名字，
       汉字是给不识维语的读者。
       类名保留 ug（它就是维语层），下面另开一层 __cn 放汉字。 */
    direction: rtl;                 /* 从右往左，必须声明才会连写正确 */
    unicode-bidi: isolate;
    font-family: "Noto Naskh Arabic", "Scheherazade New", "Amiri",
                 "Segoe UI", Tahoma, serif;
    font-size: clamp(30px, 7.4vmin, 124px);
    line-height: 1.15;
    white-space: nowrap;
    /* ② 更亮：接近纯暖白 */
    color: #fff6e2;
    opacity: 0;
    filter: blur(20px) brightness(0.4);
    /* 光晕由多层 shadow 叠出来，比单层厚 */
    text-shadow:
      0 0 10px rgba(255, 246, 226, 0.55),
      0 0 28px rgba(230, 190, 120, 0.55),
      0 0 62px rgba(217, 178, 104, 0.40),
      0 0 120px rgba(190, 140, 70, 0.22);
  }
  /* ④ 光泽扫过：同样文字、同样字体，绝对定位盖在原字上，只多一道反光。
     字体、字号、方向必须与 .w-title__ug 完全一致才叠得准。 */
  .w-title__shine {
    position: absolute; left: 0; right: 0; top: 0;
    direction: rtl; unicode-bidi: isolate;
    font-family: "Noto Naskh Arabic", "Scheherazade New", "Amiri",
                 "Segoe UI", Tahoma, serif;
    font-size: clamp(30px, 7.4vmin, 124px);
    line-height: 1.15;
    white-space: nowrap;
    background: linear-gradient(100deg,
      rgba(255,255,255,0) 40%,
      rgba(255, 253, 244, 1) 50%,
      rgba(255,255,255,0) 60%);
    background-size: 260% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    pointer-events: none;
    opacity: 0;
    animation: wShine 5.2s ease-in-out infinite;
  }
  @keyframes wShine {
    0%   { background-position: 170% 0; opacity: 0; }
    10%  { opacity: 0.9; }
    44%  { background-position: -70% 0; opacity: 0; }
    100% { background-position: -70% 0; opacity: 0; }
  }
  /* ③ 呼吸：明暗 + 极轻微的缩放。幅度小才高级，大了就俗。 */
  @keyframes wBreath {
    0%, 100% {
      text-shadow:
        0 0 10px rgba(255, 246, 226, 0.50),
        0 0 28px rgba(230, 190, 120, 0.48),
        0 0 62px rgba(217, 178, 104, 0.34),
        0 0 120px rgba(190, 140, 70, 0.18);
    }
    50% {
      text-shadow:
        0 0 14px rgba(255, 246, 226, 0.80),
        0 0 40px rgba(230, 190, 120, 0.78),
        0 0 90px rgba(217, 178, 104, 0.60),
        0 0 170px rgba(190, 140, 70, 0.34);
    }
  }
  .w-title__ug.is-live { animation: wBreath 4s ease-in-out infinite; }

  /* 汉字：维语下面一行，小一号。
     用宋体一系（发布会那种大字标题用它最稳），字距拉开。
     跟着呼吸一起微微发亮。

     **margin-top 得给得很大**：视频自带的那道金线横穿画面正中
     （实测视频中线 = 视口中线，y=450），维语压在那条线上。
     金线周围有一圈辉光，汉字落进那圈里就会被洗掉 ——
     实测 23px、54px、117px 三档都还在辉光圈里，
     所以取 26vmin（1600×900 下约 234px），彻底让开。
     位置是量出来的，不是估的（见 tools/title-layout.mjs）。 */
  .w-title__cn {
    margin-top: clamp(90px, 26vmin, 300px);
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
    font-size: clamp(14px, 2.5vmin, 40px);
    line-height: 1.5;
    letter-spacing: 0.5em; text-indent: 0.5em;
    white-space: nowrap;
    color: #f4e9cf;
    opacity: 0;
    /* 光晕里带一层**暗底衬**：金线的辉光是一整条亮带，
       白字压在上面会被洗掉（试过只加暖光晕，没用）。
       在暖光晕前面插两层近黑的 shadow，等于给字垫了个底，
       黑底又和画面本身的黑色接得上，看不出来。 */
    text-shadow:
      0 0 6px rgba(0, 0, 0, 0.95),
      0 1px 14px rgba(0, 0, 0, 0.85),
      0 0 18px rgba(217, 178, 104, 0.45),
      0 0 44px rgba(217, 178, 104, 0.20);
    animation: wCnBreath 4s ease-in-out infinite;
  }
  @keyframes wCnBreath {
    0%, 100% {
      text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 1px 14px rgba(0,0,0,0.85),
                   0 0 18px rgba(217,178,104,0.40), 0 0 44px rgba(217,178,104,0.16);
    }
    50% {
      text-shadow: 0 0 6px rgba(0,0,0,0.95), 0 1px 14px rgba(0,0,0,0.85),
                   0 0 26px rgba(217,178,104,0.66), 0 0 62px rgba(217,178,104,0.30);
    }
  }

  /* 分隔线：放在汉字下面，不跟任何文字重叠 */
  .w-title__rule {
    margin-top: clamp(16px, 3vmin, 46px);
    width: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240, 210, 150, 0.75), transparent);
    box-shadow: 0 0 12px rgba(217, 178, 104, 0.5);
    opacity: 0;
  }
  /* 原来是「维吾尔文在上、中文在下」两行。
     现在中文提上来当主标题了，下面这行中文就多余，去掉。
     （.w-title__cn 的样式一并删掉，免得留个没人用的规则。） */
  @keyframes wCn {
    0%, 100% { text-shadow: 0 0 16px rgba(217,178,104,0.38), 0 0 40px rgba(217,178,104,0.16); }
    50%      { text-shadow: 0 0 22px rgba(217,178,104,0.62), 0 0 56px rgba(217,178,104,0.28); }
  }
  .w-title__lat {
    margin-top: clamp(10px, 1.8vmin, 26px);
    font-family: var(--font-sans);
    font-size: clamp(7px, 1.1vmin, 17px);
    letter-spacing: 0.66em; text-indent: 0.66em;
    color: rgba(226, 216, 194, 0.62);
    text-shadow: 0 0 14px rgba(217, 178, 104, 0.25);
    opacity: 0;
  }

  /* ---- 入口：右上角，**一直显示** ----
     原来只在第 7 秒后才浮现，循环回开头又消失 ——
     用户说"再次循环播放就又没了，得等再放一遍才有，这样太奇怪了"。
     现在常驻，用毛玻璃（backdrop-filter）降低存在感，
     不挡画面，但随时能点。

     **圆润**：用户嫌长方形"太俗"。
     所以做成胶囊形（border-radius: 999px），描边和底色都压到很淡 ——
     它应该像贴在画面外的一层玻璃，不像一个按钮压在视频上。 */
  .w-go {
    position: absolute; z-index: 8;
    right: clamp(1.2rem, 3.5vw, 2.6rem);
    top: clamp(1.2rem, 3.5vh, 2.2rem);
    display: inline-flex; align-items: center; gap: 0.7rem;
    padding: 0.68rem 1.6rem;
    border-radius: 999px;          /* 胶囊：圆润，不是方块 */
    opacity: 0.94;
    font-family: var(--font-sans);
    font-size: clamp(0.72rem, 1.1vw, 0.84rem);
    letter-spacing: 0.3em; text-indent: 0.3em;
    color: rgba(242, 234, 218, 0.9);
    text-decoration: none;
    /* 毛玻璃：半透明底 + 背景模糊 + 一层很淡的高光边 */
    background: rgba(10, 9, 8, 0.10);
    backdrop-filter: blur(6px) saturate(115%);
    -webkit-backdrop-filter: blur(6px) saturate(115%);
    border: 1px solid rgba(242, 234, 218, 0.20);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transition: background .6s var(--ease-slow), border-color .6s var(--ease-slow),
                color .6s var(--ease-slow), opacity .6s var(--ease-slow),
                letter-spacing .6s var(--ease-slow), box-shadow .6s var(--ease-slow);
  }
  .w-go.is-here { opacity: 0.94; }   /* 兼容旧的切换，保持常显 */
  .w-go:hover, .w-go:focus-visible {
    background: rgba(192, 138, 62, 0.16);
    border-color: rgba(242, 234, 218, 0.46);
    color: #fff6e2;
    letter-spacing: 0.36em;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10),
                0 0 22px -4px rgba(192, 138, 62, 0.45);
    outline: none;
  }
  /* 片尾黑场那两秒亮一点，提示"该进去了"，但不改变常驻这件事 */
  .w-go.is-lit {
    background: rgba(192, 138, 62, 0.20);
    border-color: rgba(217, 178, 104, 0.55);
    color: #fff6e2;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 26px -6px rgba(192, 138, 62, 0.55);
  }
  .w-go__arrow { transition: transform .6s var(--ease-slow); }
  .w-go:hover .w-go__arrow { transform: translateX(4px); }

  /* 视频还没起来时的底，避免一片纯黑像坏了 */
  .w-wait {
    position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(closest-side at 50% 52%,
      rgba(120, 70, 26, 0.14) 0%, rgba(0, 0, 0, 0) 70%), #050403;
  }
</style>
</head>
<body>

<div id="stage">
  <div class="w-wait"></div>

  <!-- 概念片：整屏循环，永不让位。src 由 js/pages/welcome.js 注入 -->
  <div id="hero-video" aria-hidden="true">
    <video muted playsinline preload="none"></video>
    <video muted playsinline preload="none"></video>
    <video muted playsinline preload="none"></video>
  </div>

  <div class="w-vig"></div>
  <canvas class="w-dust" id="w-dust" aria-hidden="true"></canvas>

  <!-- 文字浮现：第三段黑场里那道金线上浮出这套文化的名字。
       **维语在上、汉字在下**（用户定的）：
       维语是它自己的名字，汉字是给不识维语的读者。
       光泽层和维语层必须字体字号完全一致，才叠得准。 -->
  <div class="w-title" id="w-title" aria-hidden="true">
    <div class="w-title__bloom" id="w-bloom"></div>
    <div class="w-title__row">
      <div class="w-title__ug" id="w-ug">ئون ئىككى مۇقام</div>
      <!-- 光泽层：同样文字、同样字体，只是用背景裁切扫一道反光 -->
      <div class="w-title__shine" aria-hidden="true">ئون ئىككى مۇقام</div>
    </div>
    <div class="w-title__cn" id="w-cn">十 二 木 卡 姆</div>
    <div class="w-title__rule"></div>
    <div class="w-title__lat">STRINGLINE HERITAGE</div>
  </div>

  <a class="w-go" id="w-go" href="../index.html">
    进入
    <span class="w-go__arrow" aria-hidden="true">→</span>
  </a>
</div>

<script src="../js/dist/welcome.js" defer></script>
</body>
</html>
