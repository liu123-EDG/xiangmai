<!DOCTYPE html>
<html lang="ug">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>弦脉 · Stringline Heritage — 丝路口传音乐的数字档案</title>
<meta name="description" content="以新疆十二木卡姆为主线的口传音乐数字档案。三段式结构、十二套木卡姆、各民族音乐形态。">
<meta name="theme-color" content="#0a0908">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="弦脉 · Stringline Heritage">
<meta property="og:description" content="丝路口传音乐的数字档案。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0908'/%3E%3Crect x='12' y='4' width='8' height='8' fill='%233a2b28'/%3E%3Crect x='12' y='12' width='8' height='8' fill='%23c08a3e'/%3E%3Crect x='12' y='20' width='8' height='8' fill='%23a33b28'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../styles.css">
<style>
  /* ==========================================================================
     入口页
     --------------------------------------------------------------------------
     一整屏，只放这条概念片，别的不许出现。

     这条片子就是 tools/film.html 那一版，时间轴原样搬过来，
     一秒没改（早先我另做了一版"循环用"的，把文字那段删掉了，是错的）：

       0.00 –  5.09   第一段  壁画推进
       5.09 – 10.18   第二段  颜色抽干
       9.00          暖光起（文字从第二段末尾就开始浮）
       9.80 – 12.20   维吾尔文浮现（模糊 → 清晰）
      12.50          分隔线展开
      12.60 – 12.90   中文、英文
      13.40 – 16.40   定格三秒
      16.40 – 17.60   淡出到黑
      17.60 →  0      回到开头，循环

     品牌和引导语都撤了 —— 它们会压住画面。
     入口做成角落一个很轻的链接，只在片尾那两秒亮起来。

     类名一律带 w- 前缀：styles.css 是序章的样式表，
     里面有 .entry / .foot / .brand 这些通用名（而且给它们设了隐藏），
     入口页用同名会被按住 —— 已经因此踩过两次。
     ========================================================================== */
  html, body {
    margin: 0; height: 100%;
    background: #000; overflow: hidden;      /* 这一页不许滚 */
    scrollbar-width: none;
  }
  body::-webkit-scrollbar { display: none; }

  #stage { position: fixed; inset: 0; background: #000; }

  /* ---- 视频层 ---- */
  #hero-video {
    position: absolute; inset: 0;
    z-index: 1; overflow: hidden; background: #000;
    opacity: 1;
  }
  #hero-video video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.5s linear;
  }
  #hero-video video.on { opacity: 1; }

  /* 极轻的压暗：只在四角收一下视线，中间不动，保住画面的冲击力 */
  .w-vig {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(closest-side at 50% 50%,
      rgba(0,0,0,0) 46%, rgba(0,0,0,0.42) 100%);
  }

  /* ---- 浮尘 ---- */
  .w-dust {
    position: absolute; inset: 0; z-index: 3;
    width: 100%; height: 100%;
    mix-blend-mode: screen; opacity: 0;
    pointer-events: none;
  }

  /* ---- 文字浮现层 ---- */
  .w-title {
    position: absolute; inset: 0; z-index: 4;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2.2vmin;
    text-align: center;
    pointer-events: none;
  }
  .w-title__ug {
    direction: rtl;                 /* 维吾尔文从右往左，必须声明才会连写正确 */
    unicode-bidi: isolate;
    font-family: "Noto Naskh Arabic", "Scheherazade New", "Amiri",
                 "Segoe UI", Tahoma, serif;
    font-size: clamp(28px, 6.8vmin, 112px);
    line-height: 1.5;
    white-space: nowrap;
    color: #f2e4c4;
    text-shadow: 0 0 26px rgba(217, 178, 104, 0.32), 0 0 74px rgba(217, 178, 104, 0.15);
    opacity: 0;
    filter: blur(20px) brightness(0.4);
  }
  .w-title__rule {
    width: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(217, 178, 104, 0.55), transparent);
    opacity: 0;
  }
  .w-title__cn {
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
    font-size: clamp(11px, 2vmin, 32px);
    letter-spacing: 0.62em; text-indent: 0.62em;
    color: #d8cfb8;
    opacity: 0;
  }
  .w-title__lat {
    font-family: var(--font-sans);
    font-size: clamp(7px, 1.1vmin, 17px);
    letter-spacing: 0.66em; text-indent: 0.66em;
    color: rgba(216, 207, 184, 0.55);
    opacity: 0;
  }

  /* ---- 入口：角落一个很轻的链接 ----
     平时很淡，不跟画面抢；只在片尾黑场那两秒亮起来（js 加 is-lit）。 */
  .w-go {
    position: absolute; z-index: 5;
    right: clamp(1.2rem, 3.5vw, 2.6rem);
    bottom: clamp(1.2rem, 3.5vh, 2.2rem);
    display: inline-flex; align-items: center; gap: 0.7rem;
    padding: 0.6rem 1.3rem;
    font-family: var(--font-sans);
    font-size: clamp(0.7rem, 1.1vw, 0.82rem);
    letter-spacing: 0.34em; text-indent: 0.34em;
    color: rgba(222, 214, 200, 0.42);
    text-decoration: none;
    border: 1px solid rgba(222, 214, 200, 0.16);
    background: rgba(8, 7, 6, 0.30);
    backdrop-filter: blur(3px);
    transition: opacity .9s var(--ease-slow), color .9s var(--ease-slow),
                border-color .9s var(--ease-slow), background .9s var(--ease-slow);
  }
  .w-go:hover, .w-go:focus-visible {
    color: #f2e4c4;
    border-color: rgba(192, 138, 62, 0.85);
    background: rgba(192, 138, 62, 0.14);
    outline: none;
  }
  /* 片尾那两秒亮起来，提示"该进去了" */
  .w-go.is-lit {
    color: rgba(242, 228, 196, 0.95);
    border-color: rgba(192, 138, 62, 0.6);
    background: rgba(192, 138, 62, 0.10);
  }
  .w-go__arrow { transition: transform .6s var(--ease-slow); }
  .w-go:hover .w-go__arrow { transform: translateX(4px); }

  /* 视频还没起来时的底，避免一片纯黑像坏了 */
  .w-wait {
    position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(closest-side at 50% 52%,
      rgba(120, 70, 26, 0.14) 0%, rgba(0, 0, 0, 0) 70%), #050403;
  }
</style>
</head>
<body>

<div id="stage">
  <div class="w-wait"></div>

  <!-- 概念片：整屏循环，永不让位。src 由 js/pages/welcome.js 注入 -->
  <div id="hero-video" aria-hidden="true">
    <video muted playsinline preload="none"></video>
    <video muted playsinline preload="none"></video>
    <video muted playsinline preload="none"></video>
  </div>

  <div class="w-vig"></div>
  <canvas class="w-dust" id="w-dust" aria-hidden="true"></canvas>

  <!-- 文字浮现：第三段黑场里的那道金线上浮出「十二木卡姆」 -->
  <div class="w-title" id="w-title" aria-hidden="true">
    <div class="w-title__ug">ئون ئىككى مۇقام</div>
    <div class="w-title__rule"></div>
    <div class="w-title__cn">十 二 木 卡 姆</div>
    <div class="w-title__lat">STRINGLINE HERITAGE</div>
  </div>

  <a class="w-go" id="w-go" href="../index.html">
    进入
    <span class="w-go__arrow" aria-hidden="true">→</span>
  </a>
</div>

<script src="../js/dist/welcome.js" defer></script>
</body>
</html>
